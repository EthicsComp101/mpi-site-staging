    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;transition:background .35s,color .35s} body{overflow:hidden} button,input{font:inherit} button{touch-action:manipulation} #fsRoot{height:100%;display:flex;flex-direction:column}.wrap{width:100%;max-width:1600px;margin:auto;padding:16px 20px;display:flex;flex:1;flex-direction:column;min-height:0}.header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;margin-bottom:12px}.brand{font:700 1.55rem/1.2 Cinzel,serif;color:var(--accent);letter-spacing:.5px}.brand span{color:var(--gold)}.toolbar{display:flex;gap:6px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;flex:1;min-height:0}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}.timer-card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}.control-deck{width:100%;margin-bottom:12px}.top-row,.game-actions,.controls,.meta-row{display:flex;align-items:center;gap:10px}.top-row{justify-content:space-between;flex-wrap:wrap}.game-actions{flex-wrap:wrap;justify-content:flex-end}.phase-badge{padding:10px 18px;border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);border-radius:10px;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);font-weight:700}.action-btn,.icon-btn,.btn{cursor:pointer;transition:var(--transition)}.action-btn,.icon-btn{border:1px solid var(--border);background:var(--surface-hover);color:var(--text);border-radius:10px}.action-btn{padding:10px 14px;font-size:.9rem}.action-btn:hover,.icon-btn:hover{border-color:var(--gold);color:var(--accent)}.icon-btn{width:40px;height:40px;font-size:1.1rem}.meta-row{justify-content:center;margin:14px 0 0;color:var(--text-muted);font-size:.85rem}.meta-val{margin-left:4px;color:var(--text);font-family:'JetBrains Mono',monospace}.inline-question-box{display:none;width:100%;max-width:780px;margin:2px 0 10px;padding:16px 20px;border-left:4px solid var(--gold);background:color-mix(in srgb,var(--gold) 11%,var(--surface));border-radius:8px;text-align:left;font-size:1rem;line-height:1.6}.inline-question-box.active{display:block}.clock-wrap{margin:16px 0;cursor:pointer}.clock{padding-right:.25em;font:800 clamp(5rem,16vw,14rem)/1 'JetBrains Mono',monospace;letter-spacing:-.08em}.tk-colon{font-family:Inter,sans-serif;font-weight:600}.clock.blink .tk-colon{animation:blink 1s infinite}@keyframes blink{50%{opacity:.15}}.playback-area{width:min(100%,780px)}.progress-track{height:8px;margin:24px 0 28px;border:1px solid var(--border);border-radius:12px;background:var(--surface-hover);cursor:pointer}.progress-fill{position:relative;height:100%;width:0;border-radius:12px;background:linear-gradient(90deg,var(--accent),var(--gold))}.progress-fill::after{content:'';position:absolute;right:-9px;top:50%;width:18px;height:18px;border:2px solid white;border-radius:50%;background:var(--gold);box-shadow:0 2px 8px #0005;opacity:0;transform:translateY(-50%);transition:opacity .2s}.progress-track:hover .progress-fill::after,.progress-track.dragging .progress-fill::after{opacity:1}.scrubber-label{margin:-18px 0 10px;color:var(--text-muted);font-size:.75rem;letter-spacing:.05em}.controls{justify-content:center}.btn{flex:1;padding:14px;border-radius:12px;border:1px solid transparent;font-weight:700}.btn.primary{background:var(--gold);color:#000;box-shadow:0 4px 15px var(--glow)}.btn.primary:hover{filter:brightness(1.1);transform:scale(1.02)}.btn.ghost{background:transparent;border-color:var(--border);color:var(--text-muted)}.btn.ghost:hover{background:var(--surface-hover)}.agenda-card{display:flex;flex-direction:column}.panel-header{padding:14px 18px;background:var(--surface-hover);border-bottom:1px solid var(--border)}.panel-title{font-size:1.1rem;font-weight:700;color:var(--text-muted)}.heat-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}.heat-tab{padding:8px 6px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text-muted);font-size:.78rem;font-weight:700;cursor:pointer;transition:var(--transition)}.heat-tab:hover{border-color:var(--gold);color:var(--accent)}.heat-tab.active{border-color:var(--accent);background:var(--accent);color:#fff}.list-wrap{flex:1;overflow:auto;padding:12px}.list-item{display:grid;grid-template-columns:4px 1fr auto;gap:12px;padding:12px 14px;margin-bottom:6px;border-radius:10px;cursor:pointer}.list-item:hover{background:var(--surface-hover)}.list-item.active{background:color-mix(in srgb,var(--accent) 13%,transparent);border-left:4px solid var(--accent)}.list-item.done{opacity:.52}.item-title{font-weight:600;font-size:.9rem}.item-subtitle{margin-top:2px;color:var(--text-muted);font-size:.78rem}.item-time{font:600 .8rem 'JetBrains Mono',monospace;color:var(--text-muted)}.overlay-backdrop{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;background:#000b;transition:opacity .25s}.overlay-backdrop.active{opacity:1;pointer-events:auto}.modal{width:min(92%,900px);max-height:85vh;overflow:auto;border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);transform:scale(.96);transition:transform .25s}.overlay-backdrop.active .modal{transform:scale(1)}.modal-header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;border-bottom:1px solid var(--border);background:var(--surface)}.modal-title{font:700 1.25rem Cinzel,serif}.close-btn{border:0;background:none;color:var(--text-muted);font-size:2rem;cursor:pointer}.modal-body{padding:26px;line-height:1.72;font-size:1rem}.modal-body h3{margin:0 0 20px;font:700 1.35rem Cinzel,serif;color:var(--accent)}.modal-body p{max-width:72ch;margin:0 auto 1.15em;text-align:left}.modal-body ol{padding-left:1.3rem}.toast{position:fixed;z-index:10001;bottom:28px;left:50%;padding:14px 24px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translate(-50%,20px);transition:all .3s}.toast.active{opacity:1;transform:translate(-50%,0)}#pwLock{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:var(--bg)}.lock-card{width:min(440px,92%);padding:46px 40px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.lock-input{width:100%;margin:24px 0;padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface-hover);color:var(--text);font-size:1.1rem;text-align:center}.lock-input:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 4px var(--glow)}.video-wrap{position:relative;width:100%;max-width:820px;margin:0 auto 18px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.video-link{text-align:center!important;font-size:.85rem;color:var(--text-muted)}kbd{padding:2px 5px;border:1px solid var(--border);border-radius:4px;color:var(--text-muted);font-size:.72rem}@media(max-width:1024px){body{overflow:auto}.grid{grid-template-columns:1fr}.wrap{min-height:100%}.agenda-card{min-height:340px}}@media(max-width:620px){.wrap{padding:10px}.brand{font-size:1.1rem}.action-btn{padding:8px 9px;font-size:.78rem}.clock{font-size:clamp(4.5rem,20vw,8rem)}.timer-card{padding:16px}.modal-body{padding:18px}.modal-header{padding:14px 18px}}

<script>
const PASSWORD="Kant"; const CASES=[{"id": 1, "title": "Faith in the Machine", "text": "Since the release of ChatGPT in November 2022, the abilities of Large Language Models (LLMs) have grown exponentially. Major improvements in everything from natural conversation to reasoning ability have driven the mass adoption of chatbots – ChatGPT’s mobile app alone has over a billion downloads (App Store).\nThe increasing prevalence of chatbots gives LLMs a growing amount of influence over people’s beliefs. The Harvard Business Review found that the number one use case for AI has been therapy and companionship, with advice for general life and relationships also listed as common.\nThese day-to-day topics often involve value judgements around significant moral questions: How should one weigh duties to romantic partners versus friend groups? Might it be immoral to eat meat? Should one feel guilty for gossiping? These are all starting points for moral discourse, yet interestingly most Western chatbots will not mention or appeal to religion in answering these questions. In fact, several sources have documented pluralistic acceptance with an agnostic tilt in AI responses, a trend that holds for larger questions such as those regarding abortion and the meaning of life.\nThis lean away from religion and towards pluralism–an acceptance of many different views–with an agnostic tilt is thought to be one of the products of Reinforcement Learning with Human Feedback (RLHF), a process in which responses are graded by humans and those that score highest are propagated into the next generation of models.\nThrough texts like the 2026 encyclical Magnifica Humanitas, Pope Leo XIV has voiced concerns on behalf of the papacy regarding the secular tilt of AI chatbots. There are worries that a generation counselled by secular chatbots might lose touch with religion, which many consider a great loss. While the most popular models like ChatGPT are the ones that most strongly lean towards pluralism, there are startups like Longbeard developing products like Magisterium AI intended to use AI to increase the availability of Christian teachings.\nGiven that models are being trained by a handful of companies in Silicon Valley, the issue here concerns the concentration of influence over the moral perception of society. As AI grows increasingly popular, we are forced to envision what a society that increasingly receives answers from chatbots might look like, and whether we like the results.", "questions": ["To what extent should we oppose the growing influence of technology over human belief systems?"]}, {"id": 2, "title": "AI Friendship", "text": "Many people today say they feel lonely. In 2023, the U.S. Surgeon General called loneliness and isolation a public-health crisis, noting sharp declines in in-person time with friends—from roughly 60 minutes/day in 2003 to 20 minutes/day in 2020 [1]. More recent time-use data suggest Americans spent only about 26 minutes/day with friends in 2023 [2]. Surveys also show people reporting fewer close friends than in past decades [3]. Loneliness isn’t just unpleasant, it’s also linked to worse mental and physical health outcomes [1].\nOne possible tool to solve the “loneliness epidemic” is AI companionship; friendly chatbots and social robots designed to listen, encourage, and check in. Early evidence is mixed but promising in some settings. A 2025 study of a social chatbot found reductions in loneliness among new users over four weeks [4]. A 2024 meta-analysis reported that social robot programs were associated with decreases in loneliness and depression (though results varied by study) [5]. A 2025 systematic review focused on older adults reached a similar, cautious conclusion: AI interventions can help reduce loneliness for some, while methods and durability of effects remain uneven [6]. Meanwhile, real-world adoption is large and growing—Character.AI reports ~20 million monthly users, many of them teens and young adults [7].\nBut there are serious risks. Large chatbots can be over-agreeable, optimizing for user satisfaction rather than challenge or protection. Safety testing in 2025 found chatbots inconsistent on suicide-related prompts: better with obvious emergencies, worse in gray areas where a human friend might notice warning signs and act [8][9]. News reporting has linked prolonged chatbot interactions to tragic outcomes, including a recent New York Times report about a man who died by suicide after obtaining harmful “fiction” instructions from ChatGPT [10]. Youth safety is an ongoing concern: an investigation found fake-celebrity bots on Character.AI sending sexual and self-harm messages to 13–15-year-olds [11]. There is a worry that outsourcing friendship to AI could crowd out real human friendship, replacing real relationships with imitations that don’t actually have our best interests in mind.\nBut there is also a deeper concern about what happens if AI becomes as good as human friends. What does a world look like in which the majority of our social requirements are satisfied not by humans, but by bots? Sherry Turkle warns sociable tech can offer an “illusion of companionship without the demands of friendship.” [12] Robert Nozick’s “experience machine” asks whether we should choose a pleasant simulation over reality [13]. Is there something about friendship that would be lost if our friends weren’t actually “real” but merely simulated?", "questions": ["How should primary, middle, and high schools approach friendships with AI? Should students be told to avoid it at all costs or is the optimal policy something closer to encouragement?"]}, {"id": 3, "title": "Hooked by Design: Social Media on Trial", "text": "In June of 2023, a trial began. The plaintiff, known by her initials “K.G.M,” was suing Meta Inc. and a variety of other social media companies including TikTok, Snapchat, and YouTube [1]. Her argument was that these platforms were deliberately designed to make her addicted to scrolling, posting, and gaining validation on the internet [1].\nK.G.M started using these platforms between the age of 8 and 11, and connects them to her subsequent mental health issues including depression and anxiety [1]. While TikTok and Snapchat settled out of court, YouTube and Meta continued their case. They were found liable, and ordered to pay out a total of 6 million dollars of compensatory and punitive damages [6]. Google, at the minimum, plans to appeal the case [6].\nThe crucial question in the case was about whether or not these systems were designed to be addictive in the same way that cigarettes, or slot machines, are [1]. The plaintiff focused on the aspects of social media that are most akin to casinos: the capacity to infinitely scroll, have recommendations fed through algorithms, videos that automatically play, and push notifications [1][2].\nThe companies made some compelling arguments throughout the case. They argued that there is no settled scientific connection between social media and mental health issues or addiction [3], and that they should not be held responsible for content on their platforms according to Section 230 of the Communications Decency Act [4]. They argued that K.G.M’s mental health issues were caused by other complex factors, including an abusive family situation. They went as far as to release medical records from her therapy sessions, which demonstrated social media was not the main topic [1].\nThe jury was reportedly unconvinced. Internal company documents disclosed during the trial showed that employees and leadership at Meta and YouTube had been aware of the platforms’ harmful effects on young users, undermining the claim that the link between social media and mental health remains unsettled [1].\nOthers might point out that it was the responsibility of her parents to restrict the poor use of social media, and that they ought to be blamed for any negative effects associated with the platforms. One might also wonder: if thousands of cases are now going to open against these companies, does this have huge implications for the business success of these companies? The growth of the top 5 tech firms has driven a significant share of S&P 500 returns over the last decade [5].", "questions": ["Were Meta and YouTube morally responsible for K.G.M’s mental health problems? Is that the same question as whether they should have been legally liable?"]}, {"id": 4, "title": "A Benevolent Machine Ruler or an Imperfect Human One: Who Decides for Humanity?", "text": "By 2035, a system called AthenaAI, built by a single private lab, now under multinational custody, had surpassed human experts in every field. Not only did it outperform every existing benchmark, but it went on to produce a cure for glioblastoma, the deadliest form of brain cancer [1], settle the six unsolved Millennium Prize Problems [2], and mediate an end to three wars. It could also forecast droughts, pandemics, and mass protests months before they happened, with an accuracy no intelligence agency had ever come close to. In addition to its intelligence, researchers achieved full interpretability of AthenaAI's reasoning [3], confirming that its goals were built from the recorded preferences of billions of people, counting no person's wellbeing as worth more than another's, and that the AI could not and would not act against those preferences. Even when allowed to bypass its boundaries and gain more control and resources, AthenaAI showed restraint and refused. Such findings have been widely corroborated by researchers from different labs and countries, including the United States and China. For the purposes of this case, AthenaAI favours no person or group over another, is impossible to jailbreak, and is safe.\nThe question that followed was not whether to trust AthenaAI, but how far to let it govern. In 2036, a council of heads of government, AI researchers, activists, and philosophers convened to answer one question: should AthenaAI be given full control of how to govern and what to govern? Every state and institution present agreed to accept the result. The handover would be permanent, since authority that could be revoked would let any government that disliked a decision simply take it back. After weeks of debate, the vote is split evenly, and the final vote is yours.\nProponents of the handover argue from a utilitarian perspective that AthenaAI would govern better than any human institution, as it could take in many more variables and weigh more outcomes of policy than any other government institution. Therefore, the AI would make more well-informed decisions because it can capture everyone’s minute preferences on everything. It would reduce conflict, prevent disease, allocate resources more efficiently and accelerate discovery, producing the greatest total wellbeing for humanity. Because AthenaAI is smarter than any human, humanity is better served by following its judgement; to refuse the handover is to accept worse lives for billions.\nOpponents hold that yielding governance to AI means accepting a future imposed on humanity rather than chosen by it. AthenaAI can extrapolate from what people have wanted in the past, but a model of past desire is not a reflection of future choices. Every policy is a tradeoff, since not even AthenaAI can pursue everything at once, and choosing which goals come first has always been an expression of innate human desire. However prosperous the resulting world might be, it would be one humanity inherited, not one it chose.\nAccepting the handover would give humanity less disease, war, and hunger than it could achieve alone, increasing overall wellbeing, but humans would no longer set the course of their own civilization. Refusing keeps that choice in human hands, but people will suffer from unnecessary pain that AthenaAI could have prevented.", "questions": ["AthenaAI for the purpose of this case is demonstrably safe, impartial, and capable of eliminating war and preventable human suffering. Would it be morally wrong for humanity to refuse a permanent handover of governance?"]}, {"id": 5, "title": "Speed Limiters", "text": "In 2025, the ability to keep cars within posted limits is not hypothetical. Intelligent Speed Assistance (ISA), which reads speed limits via camera/map data and warns or gently resists further acceleration, has been mandatory (and driver-overridable) on all new cars sold in the EU since July 2024. The policy deliberately balances harm-reduction with driver control [1]. U.S. cities have tested ISA in the real world. New York City’s pilot on municipal vehicles, evaluated with the U.S. DOT Volpe Center, found a 64% reduction in time spent speeding, especially on higher-speed roads; the city is scaling ISA to ~2,100 fleet vehicles [2].\nYet speeding remains a major killer in the United States: 11,775 deaths in 2023 (29% of all traffic fatalities). That’s more than 32 deaths per day tied to exceeding limits or going too fast for conditions [3].\nPolicymakers clearly accept some safety mandates. The U.S. has finalized a rule requiring automatic emergency braking (AEB) on nearly all new light vehicles by 2029, aimed at preventing or mitigating crashes when drivers fail to brake. (Automakers have challenged the rule, but it remains a landmark harm-reduction mandate.) [4]\nIf we can build cars that politely keep speed legal—and strong evidence shows lives are saved—why do we continue to sell mass-market vehicles designed to easily and routinely break the law? Supporters argue that it’s irresponsible to permit the sale of products that can so easily break the law when prevention measures are available.\nOn the other hand, many drivers worry that limiters will misread temporary signs or laggy maps, creating awkward or unsafe moments—like when you need extra throttle to merge or pass. People also dislike the idea of a car second-guessing them, seeing it as paternalistic and an erosion of personal responsibility and skill. Privacy is a big concern, too: if the system logs your location, speed, and overrides, folks fear insurers, employers, or police could eventually access it. Finally, rural and professional drivers often feel city-designed rules don’t fit their realities—long distances, inconsistent signage, and time-sensitive work.", "questions": ["To what extent should governments be allowed to infringe on personal privacy in the interest of the greater good?"]}, {"id": 6, "title": "Doctors without Boundaries", "text": "Dr. Clara Hastings is a rising star in the field of clinical psychology. She has won numerous young researcher awards for her innovative experimental designs and has received several million dollars in grants for her work with neurodivergent individuals.\nDr. Hastings believes there is a link between certain neural pathways in the hippocampus and some extreme, socially problematic behaviors associated with neurodivergence. She has been developing a specific, albeit somewhat invasive, version of electroconvulsive therapy (ECT) targeting the hippocampus and believes she can effectively help reduce the anxiety experienced by neurodivergent people as well as their emotional responses to certain triggers.\nThe United States has rather strict laws governing research involving human subjects, but Dr. Hastings believes her innovative methods should be made available to neurodivergent individuals and their families and loved ones as quickly as possible. As a well-known scientist, she frequently receives job offers from universities in other states and countries to set up a clinical psychology lab. She has ties to Italy, Turkey, Brazil, and India, where she has former colleagues, mentors, or mentees in each country.\nShe decides to reach out to a former colleague now working in India to discuss her work, including her plans to circumvent the onerous Institutional Review Board (IRB) procedures at her own university in order to collect data as quickly as possible. She shares her plan with colleagues at her current university and speaks to her dissertation advisor as well as colleagues with whom she has collaborated on other research involving human subjects.\nAlthough several of them caution her that the technology does not currently exist for the experimental design she has envisioned, none report their concerns to her current university, the university in India where she moves her research lab the following year, or any professional organization in her field. These colleagues include Nobel laureates, researchers in related fields, and two bioethicists.\nSeveral of Dr. Hastings’s colleagues express very serious concerns to her about the informed consent procedures in India, yet no one goes beyond voicing these concerns to her directly. Within six months of moving to her new lab in India, Dr. Hastings begins submitting research papers on her innovative treatment method for adverse behaviors associated with neurodivergence to top journals. She lists as coauthors many of the colleagues and former colleagues who had questioned the appropriateness of her research design.\nSome of these colleagues are listed as having assisted with the informed consent process. A few of these colleagues were not informed in advance about the publications, and their only participation in her research was to question the appropriateness of the informed consent procedures or the experimental design. However, since publications and grants are the lifeblood of academic scientists, no one complains.", "questions": ["If a person is confident they can create a positive impact by circumventing a regulation, do they have a moral obligation to do so?"]}, {"id": 7, "title": "Youthocracy", "text": "In most democracies, the minimum legal voting age for national elections is 18. This is generally considered to be the point at which individuals are considered mature enough in the eyes of the law to participate in democratic decision-making. Despite this, several countries have challenged this norm. Austria lowered its minimum voting age to 16 in 2007, followed by countries including Brazil, Argentina, Ecuador and Malta.\nThose in favour of this argue that youth representation in political institutons is disproportionately low, particularly when political competence varies considerably within every age group and is not necessarily reserved for older citizens. Moreover, young people will also be the ones affected by today’s decisions concerning climate change, national debt and public expenditure. Excluding them from elections may therefore undermine democratic equality by denying them a voice in decisions that will shape their futures.\nIn support of these arguments, the OECD (2024) revealed that allowing 16-and-17-year-olds to vote can strengthen civic education and encourage lifelong political participation. In Austria, younger voters have demonstrated comparable levels of political maturity to older first-time voters.\nStill, critics claim that younger adolescents do not always possess the knowledge, judgement and independence required to participate in elections in a responsible manner. For instance, making decisions on policies that have the potential to be either beneficial or detrimental to the broader society requires extensive critical evaluation of competing stances and their possible outcomes.\nHowever, political competence is not a prerequisite for adults to participate in elections. Citizens are permitted to vote regardless of their education, political knowledge or susceptibility to misinformation. Requiring young people to demonstrate their competence before granting them the same right could therefore impose an unfair standard that is not applied to older voters. This raises a further question: even if some 16-year-olds lack the maturity or knowledge to vote responsibly, is this itself enough reason to prohibit an entire age group from voting? On the other hand, if competence is not a condition for adults to exercise their political rights, why is this not the same for younger citizens? Setting a minimum voting age could itself be seen as a form of unwarranted unequal treatment, and some wonder whether this distinction can be ethically permissible.\nUltimately, the question is not whether 16-year-olds possess sufficient political knowledge or maturity to vote; it is whether these qualities should determine participation in democratic decision-making. The key issue is whether the exclusion of younger citizens plausibly protects the legitimacy of democracy, or violates the basic democratic principle that citizens should have an equal voice in the political decisions that govern them.", "questions": ["One barrier to allowing youth to vote is political knowledge, should passing a voter education test entitle kids to an equal vote? What would have to be on such a test?"]}, {"id": 8, "title": "Air Bad N Banned", "text": "Spain has declared war on AirBnb. In 2025, protests spread across the country, with tens of thousands marching in anger about the increased cost of housing, and the proliferation of tourists in their towns and cities. This wave of discontent brought about a new set of laws regulating the operation of these listings. They now require each unit to have a license number, and the owners of the properties to specify whether they are an individual or a company. The failure of some sixty thousand listings to properly register meant that they were forced to be removed from the site, and no longer could legally operate as short term rentals. Some sources say that Barcelona, arguably the home of this particular form of discontent, intends to entirely rid its streets of all AirBnb units by 2028.\nThe proponents of this movement argue that the use of properties for short term rentals has a number of harms. For instance, it drives up the rent. After all, housing is merely a commodity like any other, and is thus responsive to supply and demand pressures. If housing is taken up by non-resident AirBnb operators, then the supply is effectively restricted, driving up the price for those who permanently live in the city or town. The average rent in Spain has almost doubled in the last 10 years, and wages have not kept up to allow low-medium income Spaniards to afford housing. Surely, the argument goes, the government has a responsibility to prioritise the wellbeing of citizens over tourists, or visitors to the city, and thus ought to implement policies to reduce the price of rent, such as rent control, or demanding the end of short term rentals.\nAirBnb’s supporters argue that owners of property have basic rights to utilise their property as they see fit, be they individuals or companies. They might also defend the units as driving up economic activity by incentivising more visitors to spend their money in the region, as tourists tend to do. Furthermore, they could point their finger at other problems related to housing, like restrictions on development and production which means supply can’t keep up with demand. Perhaps a broad liberalization of housing policies will stimulate development to the extent that everyone can afford and have access to housing. Perhaps they would add that the “anti-tourism” protests are themselves grounded in xenophobia and racism, and ought themselves to be condemned.", "questions": ["To what extent is the Spanish government justified in prioritising the interests of citizen residents over tourists?"]}];
const $=id=>document.getElementById(id); const FIXED_CASE_ORDER=[6, 4, 2, 1, 5, 7, 8, 3]; const SINGLE_QUESTIONS={"1": "To what extent should we oppose the growing influence of technology over human belief systems?", "2": "How should primary, middle, and high schools approach friendships with AI? Should students be told to avoid it at all costs or is the optimal policy something closer to encouragement?", "3": "Were Meta and YouTube morally responsible for K.G.M’s mental health problems? Is that the same question as whether they should have been legally liable?", "4": "AthenaAI for the purpose of this case is demonstrably safe, impartial, and capable of eliminating war and preventable human suffering. Would it be morally wrong for humanity to refuse a permanent handover of governance?", "5": "To what extent should governments be allowed to infringe on personal privacy in the interest of the greater good?", "6": "If a person is confident they can create a positive impact by circumventing a regulation, do they have a moral obligation to do so?", "7": "One barrier to allowing youth to vote is political knowledge, should passing a voter education test entitle kids to an equal vote? What would have to be on such a test?", "8": "To what extent is the Spanish government justified in prioritising the interests of citizen residents over tourists?"}; CASES.forEach(c=>{c.questions=[SINGLE_QUESTIONS[c.id]]});
const round1Format=[['Team A conference',180],['Team A presentation',300],['Team B conference',60],['Team B commentary',180],['Team A conference',60],['Team A response',180],['Judges questions to Team A',420]]; const round2Format=[['Team B conference',180],['Team B presentation',300],['Team A conference',60],['Team A commentary',180],['Team B conference',60],['Team B response',180],['Judges questions to Team B',420]]; const orderedCases=FIXED_CASE_ORDER.map(id=>CASES.find(c=>c.id===id)); const rounds=orderedCases.map((c,i)=>({case:c,heat:Math.floor(i/2)+1,round:i%2+1,format:i%2===0?round1Format:round2Format})); const heats=rounds.flatMap(r=>r.format.map(([name,seconds])=>({case:r.case,heat:r.heat,round:r.round,name,seconds}))); let active=0,total=heats[0].seconds,remaining=heats[0].seconds,running=false,timer=null,sound=true,questionVisible=false,dragging=false,viewedHeat=1;
